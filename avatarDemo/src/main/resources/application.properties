spring.application.name=avatarDemo

# Activate local profile if running locally
spring.profiles.active=local

# Gemini OpenAI-compatible configuration
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:${GEMINI_API_KEY:your-gemini-or-openai-api-key}}}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.openai.embedding.model=${SPRING_AI_OPENAI_EMBEDDING_MODEL:gemini-embedding-001}

# LiveKit Cloud credentials
livekit.url=${LIVEKIT_URL:wss://your-project.livekit.cloud}
livekit.api-key=${LIVEKIT_API_KEY:your-livekit-api-key}
livekit.api-secret=${LIVEKIT_API_SECRET:your-livekit-api-secret}
